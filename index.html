<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Solar Monitor</title>
</head>

<body>

<h1>Solar Monitor</h1>

<div>
Solar Power: <span id="solar">0</span> W
</div>

<div>
Grid Power: <span id="grid">0</span> W
</div>

<div>
Load Power: <span id="load">0</span> W
</div>

<script>

async function loadData(){

 const res = await fetch("/api/status");
 const data = await res.json();

 document.getElementById("solar").innerText = data.solar || 0;
 document.getElementById("grid").innerText = data.grid || 0;
 document.getElementById("load").innerText = data.load || 0;

}

setInterval(loadData,2000);

</script>

</body>
</html>
